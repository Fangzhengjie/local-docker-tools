# 数据库：PostgreSQL, Redis, MySQL, MSSQL, MongoDB, Cassandra, OpenSearch
# Usage: docker compose -f docker-compose-database.yml up -d
name: database

services:

  postgres:
    restart: always
    image: postgres:alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: cZgWD@tPYvTx^EZAWQ-_g5aY
      POSTGRES_DB: postgres
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
    ports:
      - "5432:5432"
    volumes:
      - ${VOLUME_BASE}/postgresql:/var/lib/postgresql
    networks:
      database-network:
      devops-network:
      ai-network:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    restart: always
    image: redis:alpine
    container_name: redis
    command: redis-server --appendonly yes --requirepass cZgWD@tPYvTx^EZAWQ-_g5aY
    ports:
      - "6379:6379"
    volumes:
      - ${VOLUME_BASE}/redis:/data
    networks:
      database-network:
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "cZgWD@tPYvTx^EZAWQ-_g5aY", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  mysql:
    restart: always
    image: mysql:latest
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: cZgWD@tPYvTx^EZAWQ-_g5aY
      MYSQL_DATABASE: camunda
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max-connections=200
      --transaction-isolation=READ-COMMITTED
    ports:
      - "3306:3306"
    volumes:
      - ${VOLUME_BASE}/mysql/data:/var/lib/mysql
    networks:
      database-network:
      devops-network:
    healthcheck:
      test: ["CMD-SHELL", "mysql -u root -p$$MYSQL_ROOT_PASSWORD -e 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mssql:
    restart: always
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: mssql
    user: root
    environment:
      ACCEPT_EULA: Y
      SA_PASSWORD: cZgWD@tPYvTx^EZAWQ-_g5aY
      MSSQL_SA_PASSWORD: cZgWD@tPYvTx^EZAWQ-_g5aY
    ports:
      - "1433:1433"
    volumes:
      - ${VOLUME_BASE}/mssql/data:/var/opt/mssql/data
    networks:
      database-network:
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/1433' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  mongodb:
    restart: always
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo
      MONGO_INITDB_ROOT_PASSWORD: cZgWD@tPYvTx^EZAWQ-_g5aY
    volumes:
      - ${VOLUME_BASE}/mongodb/data:/data/db
    networks:
      database-network:
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  cassandra:
    restart: always
    image: cassandra:latest
    container_name: cassandra
    environment:
      # 单节点模式
      CASSANDRA_CLUSTER_NAME: "LocalCluster"
      CASSANDRA_DC: "dc1"
      CASSANDRA_RACK: "rack1"
      CASSANDRA_ENDPOINT_SNITCH: "GossipingPropertyFileSnitch"
      # JVM 内存设置（开发环境减少内存占用）
      MAX_HEAP_SIZE: "512M"
      HEAP_NEWSIZE: "128M"
    ports:
      - "9042:9042"     # CQL native transport
      - "7000:7000"     # Inter-node cluster communication
      - "7199:7199"     # JMX monitoring
    volumes:
      - ${VOLUME_BASE}/cassandra:/var/lib/cassandra
    networks:
      database-network:
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ─────────────────────────────────────────────
  # 搜索：opensearch + opensearch-dashboards
  # ─────────────────────────────────────────────

  opensearch-init:
    image: alpine:latest
    container_name: opensearch-init
    command: sh -c "chown -R 1000:1000 /data"
    volumes:
      - ${VOLUME_BASE}/opensearch/data:/data
    restart: "no"
    networks:
      database-network:

  opensearch:
    restart: always
    image: opensearchproject/opensearch:latest
    container_name: opensearch
    depends_on:
      opensearch-init:
        condition: service_completed_successfully
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      DISABLE_SECURITY_PLUGIN: "true"
      plugins.security.ssl.http.enabled: "false"
      plugins.security.ssl.transport.enabled: "false"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ${VOLUME_BASE}/opensearch/data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
      - "9600:9600"
    networks:
      database-network:
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  opensearch-dashboards:
    restart: always
    image: opensearchproject/opensearch-dashboards:latest
    container_name: opensearch-dashboards
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      "OPENSEARCH_HOSTS": '["http://opensearch:9200"]'
      "DISABLE_SECURITY_DASHBOARDS_PLUGIN": "true"
      "SERVER_BASEPATH": "/opensearch"
      "SERVER_REWRITEBASEPATH": "true"
    networks:
      database-network:
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5601/opensearch/api/status"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  database-network:
    name: database-network
    external: true
  devops-network:
    name: devops-network
    external: true
  ai-network:
    name: ai-network
    external: true
