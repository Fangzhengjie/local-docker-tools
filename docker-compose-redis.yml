# Redis 集群模式部署
# 包含两种架构：
#   1. Redis Cluster（3主3从，端口 7001-7006）— 分片高可用
#   2. Redis Sentinel（1主2从 + 3哨兵，端口 6380-6382 / 26379-26381）— 主从自动故障转移
#
# 端口不与 devtools 单机 Redis (6379) 冲突，可同时运行
#
# Usage:
#   docker compose -f cluster/docker-compose-redis.yml up -d                      # 启动全部（Cluster + Sentinel）
#   docker compose -f cluster/docker-compose-redis.yml down
#
# 连接 Cluster:  redis-cli -c -p 7001 -a 'cZgWD@tPYvTx^EZAWQ-_g5aY'
# 连接 Sentinel: redis-cli -p 6380 -a 'cZgWD@tPYvTx^EZAWQ-_g5aY'
name: redis-cluster

services:

  # ═══════════════════════════════════════════════
  # Redis Cluster（3主3从，6节点）
  # ═══════════════════════════════════════════════

  # 作用：Redis：缓存、会话、分布式锁和高性能键值存储
  redis-cluster-1:
    restart: always
    image: redis:7-alpine
    container_name: redis-cluster-1
    command: >
      redis-server
      --port 7001
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --requirepass cZgWD@tPYvTx^EZAWQ-_g5aY
      --masterauth cZgWD@tPYvTx^EZAWQ-_g5aY
    ports:
      - "7001:7001"
    volumes:
      - ${VOLUME_BASE}/redis-cluster/node-1:/data
    networks:
      cluster-network:
        ipv4_address: 172.21.0.11
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7001", "-a", "cZgWD@tPYvTx^EZAWQ-_g5aY", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 作用：Redis：缓存、会话、分布式锁和高性能键值存储
  redis-cluster-2:
    restart: always
    image: redis:7-alpine
    container_name: redis-cluster-2
    command: >
      redis-server
      --port 7002
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --requirepass cZgWD@tPYvTx^EZAWQ-_g5aY
      --masterauth cZgWD@tPYvTx^EZAWQ-_g5aY
    ports:
      - "7002:7002"
    volumes:
      - ${VOLUME_BASE}/redis-cluster/node-2:/data
    networks:
      cluster-network:
        ipv4_address: 172.21.0.12
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7002", "-a", "cZgWD@tPYvTx^EZAWQ-_g5aY", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 作用：Redis：缓存、会话、分布式锁和高性能键值存储
  redis-cluster-3:
    restart: always
    image: redis:7-alpine
    container_name: redis-cluster-3
    command: >
      redis-server
      --port 7003
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --requirepass cZgWD@tPYvTx^EZAWQ-_g5aY
      --masterauth cZgWD@tPYvTx^EZAWQ-_g5aY
    ports:
      - "7003:7003"
    volumes:
      - ${VOLUME_BASE}/redis-cluster/node-3:/data
    networks:
      cluster-network:
        ipv4_address: 172.21.0.13
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7003", "-a", "cZgWD@tPYvTx^EZAWQ-_g5aY", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 作用：Redis：缓存、会话、分布式锁和高性能键值存储
  redis-cluster-4:
    restart: always
    image: redis:7-alpine
    container_name: redis-cluster-4
    command: >
      redis-server
      --port 7004
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --requirepass cZgWD@tPYvTx^EZAWQ-_g5aY
      --masterauth cZgWD@tPYvTx^EZAWQ-_g5aY
    ports:
      - "7004:7004"
    volumes:
      - ${VOLUME_BASE}/redis-cluster/node-4:/data
    networks:
      cluster-network:
        ipv4_address: 172.21.0.14
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7004", "-a", "cZgWD@tPYvTx^EZAWQ-_g5aY", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 作用：Redis：缓存、会话、分布式锁和高性能键值存储
  redis-cluster-5:
    restart: always
    image: redis:7-alpine
    container_name: redis-cluster-5
    command: >
      redis-server
      --port 7005
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --requirepass cZgWD@tPYvTx^EZAWQ-_g5aY
      --masterauth cZgWD@tPYvTx^EZAWQ-_g5aY
    ports:
      - "7005:7005"
    volumes:
      - ${VOLUME_BASE}/redis-cluster/node-5:/data
    networks:
      cluster-network:
        ipv4_address: 172.21.0.15
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7005", "-a", "cZgWD@tPYvTx^EZAWQ-_g5aY", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 作用：Redis：缓存、会话、分布式锁和高性能键值存储
  redis-cluster-6:
    restart: always
    image: redis:7-alpine
    container_name: redis-cluster-6
    command: >
      redis-server
      --port 7006
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --requirepass cZgWD@tPYvTx^EZAWQ-_g5aY
      --masterauth cZgWD@tPYvTx^EZAWQ-_g5aY
    ports:
      - "7006:7006"
    volumes:
      - ${VOLUME_BASE}/redis-cluster/node-6:/data
    networks:
      cluster-network:
        ipv4_address: 172.21.0.16
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7006", "-a", "cZgWD@tPYvTx^EZAWQ-_g5aY", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 集群初始化（一次性任务，创建 3主3从拓扑）
  # 作用：初始化容器：创建集群拓扑、用户或元数据
  redis-cluster-init:
    image: redis:7-alpine
    container_name: redis-cluster-init
    depends_on:
      redis-cluster-1:
        condition: service_healthy
      redis-cluster-2:
        condition: service_healthy
      redis-cluster-3:
        condition: service_healthy
      redis-cluster-4:
        condition: service_healthy
      redis-cluster-5:
        condition: service_healthy
      redis-cluster-6:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        echo 'yes' | redis-cli -a 'cZgWD@tPYvTx^EZAWQ-_g5aY' --cluster create \
          172.21.0.11:7001 \
          172.21.0.12:7002 \
          172.21.0.13:7003 \
          172.21.0.14:7004 \
          172.21.0.15:7005 \
          172.21.0.16:7006 \
          --cluster-replicas 1 &&
        echo 'Redis Cluster created successfully!'
    networks:
      cluster-network:
        ipv4_address: 172.21.0.10
    restart: "no"

  # ═══════════════════════════════════════════════
  # Redis Sentinel（1主2从 + 3哨兵）
  # ═══════════════════════════════════════════════

  # 作用：Redis：缓存、会话、分布式锁和高性能键值存储
  redis-sentinel-master:
    restart: always
    image: redis:7-alpine
    container_name: redis-sentinel-master
    command: >
      redis-server
      --port 6380
      --appendonly yes
      --requirepass cZgWD@tPYvTx^EZAWQ-_g5aY
      --masterauth cZgWD@tPYvTx^EZAWQ-_g5aY
    ports:
      - "6380:6380"
    volumes:
      - ${VOLUME_BASE}/redis-sentinel/master:/data
    networks:
      cluster-network:
        ipv4_address: 172.21.0.20
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "-a", "cZgWD@tPYvTx^EZAWQ-_g5aY", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 作用：Redis：缓存、会话、分布式锁和高性能键值存储
  redis-sentinel-slave-1:
    restart: always
    image: redis:7-alpine
    container_name: redis-sentinel-slave-1
    command: >
      redis-server
      --port 6381
      --appendonly yes
      --requirepass cZgWD@tPYvTx^EZAWQ-_g5aY
      --masterauth cZgWD@tPYvTx^EZAWQ-_g5aY
      --replicaof redis-sentinel-master 6380
    ports:
      - "6381:6381"
    volumes:
      - ${VOLUME_BASE}/redis-sentinel/slave-1:/data
    depends_on:
      redis-sentinel-master:
        condition: service_healthy
    networks:
      cluster-network:
        ipv4_address: 172.21.0.21
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6381", "-a", "cZgWD@tPYvTx^EZAWQ-_g5aY", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 作用：Redis：缓存、会话、分布式锁和高性能键值存储
  redis-sentinel-slave-2:
    restart: always
    image: redis:7-alpine
    container_name: redis-sentinel-slave-2
    command: >
      redis-server
      --port 6382
      --appendonly yes
      --requirepass cZgWD@tPYvTx^EZAWQ-_g5aY
      --masterauth cZgWD@tPYvTx^EZAWQ-_g5aY
      --replicaof redis-sentinel-master 6380
    ports:
      - "6382:6382"
    volumes:
      - ${VOLUME_BASE}/redis-sentinel/slave-2:/data
    depends_on:
      redis-sentinel-master:
        condition: service_healthy
    networks:
      cluster-network:
        ipv4_address: 172.21.0.22
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6382", "-a", "cZgWD@tPYvTx^EZAWQ-_g5aY", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 作用：Redis：缓存、会话、分布式锁和高性能键值存储
  redis-sentinel-1:
    restart: always
    image: redis:7-alpine
    container_name: redis-sentinel-1
    command: >
      sh -c "
        cat > /tmp/sentinel.conf << 'EOF'
        port 26379
        sentinel monitor mymaster 172.21.0.20 6380 2
        sentinel auth-pass mymaster cZgWD@tPYvTx^EZAWQ-_g5aY
        sentinel down-after-milliseconds mymaster 5000
        sentinel failover-timeout mymaster 10000
        sentinel parallel-syncs mymaster 1
      EOF
        redis-sentinel /tmp/sentinel.conf
      "
    ports:
      - "26379:26379"
    depends_on:
      redis-sentinel-master:
        condition: service_healthy
      redis-sentinel-slave-1:
        condition: service_healthy
      redis-sentinel-slave-2:
        condition: service_healthy
    networks:
      cluster-network:
        ipv4_address: 172.21.0.23
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 作用：Redis：缓存、会话、分布式锁和高性能键值存储
  redis-sentinel-2:
    restart: always
    image: redis:7-alpine
    container_name: redis-sentinel-2
    command: >
      sh -c "
        cat > /tmp/sentinel.conf << 'EOF'
        port 26380
        sentinel monitor mymaster 172.21.0.20 6380 2
        sentinel auth-pass mymaster cZgWD@tPYvTx^EZAWQ-_g5aY
        sentinel down-after-milliseconds mymaster 5000
        sentinel failover-timeout mymaster 10000
        sentinel parallel-syncs mymaster 1
      EOF
        redis-sentinel /tmp/sentinel.conf
      "
    ports:
      - "26380:26380"
    depends_on:
      redis-sentinel-master:
        condition: service_healthy
    networks:
      cluster-network:
        ipv4_address: 172.21.0.24
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26380", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 作用：Redis：缓存、会话、分布式锁和高性能键值存储
  redis-sentinel-3:
    restart: always
    image: redis:7-alpine
    container_name: redis-sentinel-3
    command: >
      sh -c "
        cat > /tmp/sentinel.conf << 'EOF'
        port 26381
        sentinel monitor mymaster 172.21.0.20 6380 2
        sentinel auth-pass mymaster cZgWD@tPYvTx^EZAWQ-_g5aY
        sentinel down-after-milliseconds mymaster 5000
        sentinel failover-timeout mymaster 10000
        sentinel parallel-syncs mymaster 1
      EOF
        redis-sentinel /tmp/sentinel.conf
      "
    ports:
      - "26381:26381"
    depends_on:
      redis-sentinel-master:
        condition: service_healthy
    networks:
      cluster-network:
        ipv4_address: 172.21.0.25
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26381", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  cluster-network:
    name: cluster-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
