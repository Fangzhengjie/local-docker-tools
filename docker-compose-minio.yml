# MinIO Erasure Coding Cluster（4节点，纠删码分布式存储）
# API 端口：9002（避开 devtools minio 的 9001）
# Console 端口：9444
#
# Usage:
#   docker compose -f cluster/docker-compose-minio.yml up -d
#   docker compose -f cluster/docker-compose-minio.yml down
#
# Console: http://localhost:9444 (minioadmin / cZgWD@tPYvTx^EZAWQ-_g5aY)
# API:     http://localhost:9002
# SDK:     endpoint=localhost:9002, access_key=minioadmin, secret_key=cZgWD@tPYvTx^EZAWQ-_g5aY
name: minio-cluster

services:

  # 作用：MinIO：S3 兼容对象存储，保存文件和数据湖对象
  minio-node-1:
    restart: always
    image: minio/minio:latest
    container_name: minio-node-1
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: cZgWD@tPYvTx^EZAWQ-_g5aY
    command: server http://minio-node-{1...4}/data --console-address ":9001"
    ports:
      - "9002:9000"
      - "9444:9001"
    volumes:
      - ${VOLUME_BASE}/minio-cluster/node-1:/data
    networks:
      cluster-network:
        ipv4_address: 172.21.0.110
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # 作用：MinIO：S3 兼容对象存储，保存文件和数据湖对象
  minio-node-2:
    restart: always
    image: minio/minio:latest
    container_name: minio-node-2
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: cZgWD@tPYvTx^EZAWQ-_g5aY
    command: server http://minio-node-{1...4}/data --console-address ":9001"
    volumes:
      - ${VOLUME_BASE}/minio-cluster/node-2:/data
    networks:
      cluster-network:
        ipv4_address: 172.21.0.111
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # 作用：MinIO：S3 兼容对象存储，保存文件和数据湖对象
  minio-node-3:
    restart: always
    image: minio/minio:latest
    container_name: minio-node-3
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: cZgWD@tPYvTx^EZAWQ-_g5aY
    command: server http://minio-node-{1...4}/data --console-address ":9001"
    volumes:
      - ${VOLUME_BASE}/minio-cluster/node-3:/data
    networks:
      cluster-network:
        ipv4_address: 172.21.0.112
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # 作用：MinIO：S3 兼容对象存储，保存文件和数据湖对象
  minio-node-4:
    restart: always
    image: minio/minio:latest
    container_name: minio-node-4
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: cZgWD@tPYvTx^EZAWQ-_g5aY
    command: server http://minio-node-{1...4}/data --console-address ":9001"
    volumes:
      - ${VOLUME_BASE}/minio-cluster/node-4:/data
    networks:
      cluster-network:
        ipv4_address: 172.21.0.113
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  cluster-network:
    name: cluster-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
