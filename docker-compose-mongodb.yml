# MongoDB Replica Set（1主2从，自动选主）
# 端口：27117、27118、27119（避开 devtools 的 27017）
#
# Usage:
#   docker compose -f cluster/docker-compose-mongodb.yml up -d
#   docker compose -f cluster/docker-compose-mongodb.yml down
#
# 连接: mongosh "mongodb://root:cZgWD@tPYvTx^EZAWQ-_g5aY@localhost:27117,localhost:27118,localhost:27119/?replicaSet=rs0"
name: mongo-cluster

services:

  # 作用：MongoDB：文档型数据库
  mongo-rs-1:
    restart: always
    image: mongo:7
    container_name: mongo-rs-1
    command: mongod --replSet rs0 --bind_ip_all --keyFile /etc/mongo/keyfile --port 27117
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: cZgWD@tPYvTx^EZAWQ-_g5aY
    ports:
      - "27117:27117"
    volumes:
      - ${VOLUME_BASE}/mongo-cluster/rs-1:/data/db
      - ${VOLUME_BASE}/mongo-cluster/keyfile:/etc/mongo/keyfile:ro
    networks:
      cluster-network:
        ipv4_address: 172.21.0.60
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27117", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # 作用：MongoDB：文档型数据库
  mongo-rs-2:
    restart: always
    image: mongo:7
    container_name: mongo-rs-2
    command: mongod --replSet rs0 --bind_ip_all --keyFile /etc/mongo/keyfile --port 27118
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: cZgWD@tPYvTx^EZAWQ-_g5aY
    ports:
      - "27118:27118"
    volumes:
      - ${VOLUME_BASE}/mongo-cluster/rs-2:/data/db
      - ${VOLUME_BASE}/mongo-cluster/keyfile:/etc/mongo/keyfile:ro
    depends_on:
      mongo-rs-1:
        condition: service_healthy
    networks:
      cluster-network:
        ipv4_address: 172.21.0.61
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27118", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # 作用：MongoDB：文档型数据库
  mongo-rs-3:
    restart: always
    image: mongo:7
    container_name: mongo-rs-3
    command: mongod --replSet rs0 --bind_ip_all --keyFile /etc/mongo/keyfile --port 27119
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: cZgWD@tPYvTx^EZAWQ-_g5aY
    ports:
      - "27119:27119"
    volumes:
      - ${VOLUME_BASE}/mongo-cluster/rs-3:/data/db
      - ${VOLUME_BASE}/mongo-cluster/keyfile:/etc/mongo/keyfile:ro
    depends_on:
      mongo-rs-1:
        condition: service_healthy
    networks:
      cluster-network:
        ipv4_address: 172.21.0.62
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27119", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Replica Set 初始化
  # 作用：初始化容器：创建集群拓扑、用户或元数据
  mongo-rs-init:
    image: mongo:7
    container_name: mongo-rs-init
    depends_on:
      mongo-rs-1:
        condition: service_healthy
      mongo-rs-2:
        condition: service_healthy
      mongo-rs-3:
        condition: service_healthy
    command: >
      mongosh --host mongo-rs-1 --port 27117 -u root -p 'cZgWD@tPYvTx^EZAWQ-_g5aY' --eval '
        rs.initiate({
          _id: "rs0",
          members: [
            { _id: 0, host: "mongo-rs-1:27117", priority: 2 },
            { _id: 1, host: "mongo-rs-2:27118", priority: 1 },
            { _id: 2, host: "mongo-rs-3:27119", priority: 1 }
          ]
        });
        print("MongoDB Replica Set initialized!");
      '
    networks:
      cluster-network:
        ipv4_address: 172.21.0.63
    restart: "no"

networks:
  cluster-network:
    name: cluster-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
