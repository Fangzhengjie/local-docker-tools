# Local Docker Tools - 开发环境（基础设施 + 消息队列 + 数据库 + 可观测性 + 大数据）
#
# AI 服务请参考：docker-compose-ai.yml
#
# Usage:
#   docker compose -f docker-compose-devtools.yml up -d              # 启动所有服务
#   docker compose -f docker-compose-devtools.yml up -d nginx postgres  # 只启动指定服务
#   docker compose -f docker-compose-devtools.yml down               # 停止所有服务
name: standalone

services:

  # ─────────────────────────────────────────────
  # 基础服务：nginx + postgres + redis
  # ─────────────────────────────────────────────

  nginx:
    restart: always
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${VOLUME_BASE}/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${VOLUME_BASE}/nginx/conf.d:/etc/nginx/conf.d:ro
      - ${VOLUME_BASE}/nginx/certs:/etc/nginx/certs:ro
      - ${VOLUME_BASE}/nginx/html:/usr/share/nginx/html:ro
    networks:
      devtools-network:
        ipv4_address: 172.18.0.2

  # ─────────────────────────────────────────────
  # DNS 服务：供 Android 模拟器解析 *.local.dev
  # 模拟器启动参数: emulator -avd <名> -dns-server 10.0.2.2
  # ─────────────────────────────────────────────
  dnsmasq:
    restart: always
    image: andyshinn/dnsmasq:latest
    container_name: dnsmasq
    cap_add:
      - NET_ADMIN
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    volumes:
      - ${VOLUME_BASE}/etc/dnsmasq/dnsmasq.conf:/etc/dnsmasq.conf:ro
    networks:
      devtools-network:
        ipv4_address: 172.18.0.53

  postgres:
    restart: always
    image: postgres:alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: cZgWD@tPYvTx^EZAWQ-_g5aY
      POSTGRES_DB: postgres
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
    ports:
      - "5432:5432"
    volumes:
      - ${VOLUME_BASE}/postgresql:/var/lib/postgresql
    networks:
      devtools-network:
        ipv4_address: 172.18.0.3
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    restart: always
    image: redis:alpine
    container_name: redis
    command: redis-server --appendonly yes --requirepass cZgWD@tPYvTx^EZAWQ-_g5aY
    ports:
      - "6379:6379"
    volumes:
      - ${VOLUME_BASE}/redis:/data
    networks:
      devtools-network:
        ipv4_address: 172.18.0.5
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "cZgWD@tPYvTx^EZAWQ-_g5aY", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─────────────────────────────────────────────
  # 消息队列：kafka, kafka-ui
  # ─────────────────────────────────────────────

  kafka:
    restart: always
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    ports:
      - "9092:9092"
    networks:
      devtools-network:
        ipv4_address: 172.18.0.6
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  kafka-ui:
    restart: always
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
      SERVER_SERVLET_CONTEXT_PATH: /kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      devtools-network:
        ipv4_address: 172.18.0.7
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/kafka-ui/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─────────────────────────────────────────────
  # 搜索：opensearch + opensearch-dashboards
  # ─────────────────────────────────────────────

  opensearch-init:
    image: alpine:latest
    container_name: opensearch-init
    command: sh -c "chown -R 1000:1000 /data"
    volumes:
      - ${VOLUME_BASE}/opensearch/data:/data
    restart: "no"
    networks:
      devtools-network:
        ipv4_address: 172.18.0.60

  opensearch:
    restart: always
    image: opensearchproject/opensearch:latest
    container_name: opensearch
    depends_on:
      opensearch-init:
        condition: service_completed_successfully
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      DISABLE_SECURITY_PLUGIN: "true"
      plugins.security.ssl.http.enabled: "false"
      plugins.security.ssl.transport.enabled: "false"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ${VOLUME_BASE}/opensearch/data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
      - "9600:9600"
    networks:
      devtools-network:
        ipv4_address: 172.18.0.8
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  opensearch-dashboards:
    restart: always
    image: opensearchproject/opensearch-dashboards:latest
    container_name: opensearch-dashboards
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      "OPENSEARCH_HOSTS": '["http://opensearch:9200"]'
      "DISABLE_SECURITY_DASHBOARDS_PLUGIN": "true"
      "SERVER_BASEPATH": "/opensearch"
      "SERVER_REWRITEBASEPATH": "true"
    networks:
      devtools-network:
        ipv4_address: 172.18.0.9
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5601/api/status"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ─────────────────────────────────────────────
  # 数据库：mssql（Azure SQL Edge，兼容 SQL Server）
  # ─────────────────────────────────────────────

  mssql:
    restart: always
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: mssql
    user: root
    environment:
      ACCEPT_EULA: Y
      SA_PASSWORD: cZgWD@tPYvTx^EZAWQ-_g5aY
      MSSQL_SA_PASSWORD: cZgWD@tPYvTx^EZAWQ-_g5aY
    ports:
      - "1433:1433"
    volumes:
      - ${VOLUME_BASE}/mssql/data:/var/opt/mssql/data
    networks:
      devtools-network:
        ipv4_address: 172.18.0.4
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/1433' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─────────────────────────────────────────────
  # 存储：azure-storage（Azurite - Azure Storage 模拟器）
  # ─────────────────────────────────────────────

  azure-storage:
    restart: always
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: azure-storage
    ports:
      - "10000:10000"   # Blob
      - "10001:10001"   # Queue
      - "10002:10002"   # File Share
    volumes:
      - ${VOLUME_BASE}/azurite:/data
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --location /data --loose
    networks:
      devtools-network:
        ipv4_address: 172.18.0.15
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:10000', (r) => process.exit(r.statusCode === 400 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # NoSQL 数据库：cassandra
  # CQL 端口：9042，Web 管理界面可使用 DataStax Studio 或 cqlsh
  # ─────────────────────────────────────────────

  cassandra:
    restart: always
    image: cassandra:latest
    container_name: cassandra
    environment:
      # 单节点模式
      CASSANDRA_CLUSTER_NAME: "LocalCluster"
      CASSANDRA_DC: "dc1"
      CASSANDRA_RACK: "rack1"
      CASSANDRA_ENDPOINT_SNITCH: "GossipingPropertyFileSnitch"
      # JVM 内存设置（开发环境减少内存占用）
      MAX_HEAP_SIZE: "512M"
      HEAP_NEWSIZE: "128M"
    ports:
      - "9042:9042"     # CQL native transport
      - "7000:7000"     # Inter-node cluster communication
      - "7199:7199"     # JMX monitoring
    volumes:
      - ${VOLUME_BASE}/cassandra:/var/lib/cassandra
    networks:
      devtools-network:
        ipv4_address: 172.18.0.13
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ─────────────────────────────────────────────
  # 数据库：mysql
  # ─────────────────────────────────────────────

  mysql:
    restart: always
    image: mysql:latest
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: cZgWD@tPYvTx^EZAWQ-_g5aY
      MYSQL_DATABASE: camunda
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max-connections=200
      --transaction-isolation=READ-COMMITTED
      --mysql-native-password=ON
      --authentication-policy=mysql_native_password
    ports:
      - "3306:3306"
    volumes:
      - ${VOLUME_BASE}/mysql/data:/var/lib/mysql
    networks:
      devtools-network:
        ipv4_address: 172.18.0.14
    healthcheck:
      test: ["CMD-SHELL", "mysql -u root -p$$MYSQL_ROOT_PASSWORD -e 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────────
  # 工作流平台：Camunda 8.9.15
  # Zeebe REST API: http://localhost:8088
  # Operate:        http://localhost:8088/operate
  # Tasklist:       http://localhost:8088/tasklist
  # ─────────────────────────────────────────────

  camunda:
    restart: always
    image: camunda/camunda:8.9.15
    container_name: camunda
    ports:
      - "26500:26500"
      - "8088:8080"
    environment:
      SERVER_SERVLET_CONTEXT_PATH: /camunda
      ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_CLASSNAME: io.camunda.zeebe.exporter.ElasticsearchExporter
      ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_ARGS_URL: http://elasticsearch:9200
      ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_ARGS_BULK_SIZE: "1"
      ZEEBE_BROKER_DATA_DISKUSAGECOMMANDWATERMARK: "0.998"
      ZEEBE_BROKER_DATA_DISKUSAGEREPLICATIONWATERMARK: "0.999"
      CAMUNDA_DATA_SECONDARYSTORAGE_ELASTICSEARCH_URL: http://elasticsearch:9200
      CAMUNDA_OPERATE_ELASTICSEARCH_URL: http://elasticsearch:9200
      CAMUNDA_OPERATE_ZEEBE_GATEWAYADDRESS: localhost:26500
      CAMUNDA_TASKLIST_ELASTICSEARCH_URL: http://elasticsearch:9200
      CAMUNDA_TASKLIST_ZEEBE_GATEWAYADDRESS: localhost:26500
      CAMUNDA_TASKLIST_ZEEBE_RESTADDRESS: http://localhost:8080
      JAVA_TOOL_OPTIONS: -Xms512m -Xmx512m
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      devtools-network:
        ipv4_address: 172.18.0.17
    healthcheck:
      test: ["CMD-SHELL", "timeout 10s bash -c ':> /dev/tcp/127.0.0.1/9600'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - camunda-zeebe-data:/usr/local/camunda/data

  elasticsearch:
    restart: always
    image: elasticsearch:8.17.4
    container_name: camunda-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      bootstrap.memory_lock: "true"
      cluster.routing.allocation.disk.threshold_enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - camunda-elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      devtools-network:
        ipv4_address: 172.18.0.38
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ─────────────────────────────────────────────
  # 可观测性：prometheus + grafana
  # ─────────────────────────────────────────────

  prometheus:
    restart: always
    image: prom/prometheus:latest
    container_name: prometheus
    user: root
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.external-url=/prometheus/'
    ports:
      - "9090:9090"
    volumes:
      - ${VOLUME_BASE}/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${VOLUME_BASE}/prometheus/data:/prometheus
    networks:
      devtools-network:
        ipv4_address: 172.18.0.11
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5

  grafana:
    restart: always
    image: grafana/grafana:latest
    container_name: grafana
    user: root
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: cZgWD@tPYvTx^EZAWQ-_g5aY
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "http://localhost/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ${VOLUME_BASE}/grafana/data:/var/lib/grafana
      - ${VOLUME_BASE}/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
      - jaeger
    networks:
      devtools-network:
        ipv4_address: 172.18.0.12
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # 代码质量：sonarqube
  # ─────────────────────────────────────────────

  sonarqube:
    restart: always
    image: sonarqube:latest
    container_name: sonarqube
    user: root
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres:5432/sonarqube
      SONAR_JDBC_USERNAME: postgres
      SONAR_JDBC_PASSWORD: cZgWD@tPYvTx^EZAWQ-_g5aY
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
      # 禁用强制认证（允许匿名访问）
      SONAR_FORCEAUTHENTICATION: "false"
      # 禁用遥测
      SONAR_TELEMETRY_ENABLE: "false"
      SONAR_WEB_CONTEXT: /sonarqube
      # HTTP 代理配置（根据实际代理地址修改）
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: localhost,127.0.0.1,postgres,172.18.0.0/16
      # Java 代理配置
      SONAR_WEB_JAVAADDITIONALOPTS: >-
        -Dhttp.proxyHost=${PROXY_HOST:-}
        -Dhttp.proxyPort=${PROXY_PORT:-8080}
        -Dhttps.proxyHost=${PROXY_HOST:-}
        -Dhttps.proxyPort=${PROXY_PORT:-8080}
        -Dhttp.nonProxyHosts=localhost|127.0.0.1|postgres|172.18.*
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      # 本地绑定挂载（通过 init 脚本修复权限）
      - ${VOLUME_BASE}/sonarqube/data:/opt/sonarqube/data
      - ${VOLUME_BASE}/sonarqube/logs:/opt/sonarqube/logs
      - ${VOLUME_BASE}/sonarqube/extensions:/opt/sonarqube/extensions
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        # 以 root 身份修复权限（使用 UID:GID）
        chown -R 1000:0 /opt/sonarqube/data /opt/sonarqube/logs /opt/sonarqube/extensions
        # 切换到 sonarqube 用户执行原始入口点
        exec su -s /bin/bash sonarqube -c '/opt/sonarqube/docker/entrypoint.sh'
    networks:
      devtools-network:
        ipv4_address: 172.18.0.10
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  # ─────────────────────────────────────────────
  # API Mock：wiremock（HTTP API 模拟服务器）
  # 单实例统一管理所有外部服务的 Mock
  # 用路径前缀区分服务：/user-service/**, /order-service/** 等
  # 管理面板：http://localhost/wiremock/__admin/webapp（通过 nginx）
  # ─────────────────────────────────────────────

  wiremock:
    restart: always
    image: wiremock/wiremock:latest
    container_name: wiremock
    ports:
      - "8180:8080"    # HTTP（应用调用 Mock API）
      - "8443:8443"    # HTTPS
    volumes:
      - ${VOLUME_BASE}/wiremock/mappings:/home/wiremock/mappings
      - ${VOLUME_BASE}/wiremock/__files:/home/wiremock/__files
    command: >
      --verbose
      --global-response-templating
    networks:
      devtools-network:
        ipv4_address: 172.18.0.16
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O /dev/null http://localhost:8080/__admin/mappings || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─────────────────────────────────────────────
  # 消息队列：rabbitmq, rocketmq
  # ─────────────────────────────────────────────

  # RabbitMQ（AMQP，含 Management UI）
  rabbitmq:
    restart: always
    image: rabbitmq:management
    container_name: rabbitmq
    ports:
      - "5672:5672"     # AMQP
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: cZgWD@tPYvTx^EZAWQ-_g5aY
      RABBITMQ_MANAGEMENT_PATH_PREFIX: /rabbitmq
    volumes:
      - ${VOLUME_BASE}/rabbitmq:/var/lib/rabbitmq
    networks:
      devtools-network:
        ipv4_address: 172.18.0.21
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # RocketMQ NameServer
  rocketmq-namesrv:
    restart: always
    image: apache/rocketmq:latest
    container_name: rocketmq-namesrv
    command: sh mqnamesrv
    ports:
      - "9876:9876"
    volumes:
      - ${VOLUME_BASE}/rocketmq/namesrv/logs:/home/rocketmq/logs
    networks:
      devtools-network:
        ipv4_address: 172.18.0.22
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9876 || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # RocketMQ Broker
  rocketmq-broker:
    restart: always
    image: apache/rocketmq:latest
    container_name: rocketmq-broker
    user: root
    command: sh mqbroker -n rocketmq-namesrv:9876 autoCreateTopicEnable=true
    ports:
      - "10909:10909"
      - "10911:10911"
    environment:
      HEAP_OPTS: "-Xms256m -Xmx256m -Xmn128m -XX:MaxDirectMemorySize=256m"
    volumes:
      - ${VOLUME_BASE}/rocketmq/broker/logs:/home/rocketmq/logs
      - ${VOLUME_BASE}/rocketmq/broker/store:/home/rocketmq/store
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    networks:
      devtools-network:
        ipv4_address: 172.18.0.23
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:10911 || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # RocketMQ Dashboard
  rocketmq-dashboard:
    restart: always
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: rocketmq-dashboard
    environment:
      JAVA_OPTS: "-Drocketmq.namesrv.addr=rocketmq-namesrv:9876"
    depends_on:
      rocketmq-broker:
        condition: service_healthy
    networks:
      devtools-network:
        ipv4_address: 172.18.0.24
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────────
  # 数据库：mongodb
  # ─────────────────────────────────────────────

  mongodb:
    restart: always
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo
      MONGO_INITDB_ROOT_PASSWORD: cZgWD@tPYvTx^EZAWQ-_g5aY
    volumes:
      - ${VOLUME_BASE}/mongodb/data:/data/db
    networks:
      devtools-network:
        ipv4_address: 172.18.0.25
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─────────────────────────────────────────────
  # 存储：minio, cosmosdb
  # ─────────────────────────────────────────────

  minio:
    restart: always
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9001:9000"   # S3 API（应用直连）
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: cZgWD@tPYvTx^EZAWQ-_g5aY
    volumes:
      - ${VOLUME_BASE}/minio/data:/data
    command: server /data --console-address ":9001"
    networks:
      devtools-network:
        ipv4_address: 172.18.0.26
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  cosmosdb:
    restart: always
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:latest
    container_name: cosmosdb
    ports:
      - "8081:8081"     # Data Explorer & API
      - "10251:10251"
      - "10252:10252"
      - "10253:10253"
      - "10254:10254"
    environment:
      AZURE_COSMOS_EMULATOR_PARTITION_COUNT: 10
      AZURE_COSMOS_EMULATOR_ENABLE_DATA_PERSISTENCE: "true"
      AZURE_COSMOS_EMULATOR_IP_ADDRESS_OVERRIDE: 127.0.0.1
    volumes:
      - ${VOLUME_BASE}/cosmosdb:/tmp/cosmos/appdata
    networks:
      devtools-network:
        ipv4_address: 172.18.0.27
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "https://localhost:8081/_explorer/emulator.pem"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ─────────────────────────────────────────────
  # 可观测性：jaeger, openobserve
  # ─────────────────────────────────────────────

  jaeger:
    restart: always
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "4317:4317"     # OTLP gRPC（应用上报）
      - "4318:4318"     # OTLP HTTP（应用上报）
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      QUERY_BASE_PATH: /jaeger
    networks:
      devtools-network:
        ipv4_address: 172.18.0.18
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:16686"]
      interval: 10s
      timeout: 5s
      retries: 5

  openobserve:
    restart: always
    image: openobserve/openobserve:latest
    container_name: openobserve
    ports:
      - "5080:5080"     # OTLP HTTP（应用上报日志/链路）
    environment:
      ZO_ROOT_USER_EMAIL: admin@local.com
      ZO_ROOT_USER_PASSWORD: cZgWD@tPYvTx^EZAWQ-_g5aY
      ZO_DATA_DIR: /data
    volumes:
      - ${VOLUME_BASE}/openobserve/data:/data
    networks:
      devtools-network:
        ipv4_address: 172.18.0.28
    healthcheck:
      test: ["NONE"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────────
  # 邮件：mailpit
  # ─────────────────────────────────────────────

  mailpit:
    restart: always
    image: axllent/mailpit:latest
    container_name: mailpit
    environment:
      MP_WEBROOT: /mailpit
    ports:
      - "1025:1025"   # SMTP（应用发信）
    networks:
      devtools-network:
        ipv4_address: 172.18.0.19
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8025"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # 大数据：zookeeper, hadoop, hive, spark, flink, clickhouse
  # ─────────────────────────────────────────────

  # ZooKeeper（Hive / HBase 依赖）
  zookeeper:
    restart: always
    image: zookeeper:latest
    container_name: zookeeper
    environment:
      ZOO_4LW_COMMANDS_WHITELIST: "srvr,stat,ruok"
    ports:
      - "2181:2181"
    volumes:
      - ${VOLUME_BASE}/zookeeper/data:/data
      - ${VOLUME_BASE}/zookeeper/datalog:/datalog
    networks:
      devtools-network:
        ipv4_address: 172.18.0.30
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # Hadoop NameNode（HDFS，Hive 依赖）
  hadoop:
    restart: always
    image: apache/hadoop:3
    container_name: hadoop
    user: root
    environment:
      HADOOP_HOME: /opt/hadoop
      ENSURE_NAMENODE_DIR: /tmp/hadoop-root/dfs/name
    command:
      - bash
      - -c
      - |
        cat > /opt/hadoop/etc/hadoop/core-site.xml << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <configuration>
          <property><name>fs.defaultFS</name><value>hdfs://hadoop:8020</value></property>
        </configuration>
        EOF
        cat > /opt/hadoop/etc/hadoop/hdfs-site.xml << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <configuration>
          <property><name>dfs.replication</name><value>1</value></property>
          <property><name>dfs.namenode.name.dir</name><value>/tmp/hadoop-root/dfs/name</value></property>
          <property><name>dfs.datanode.data.dir</name><value>/tmp/hadoop-root/dfs/data</value></property>
        </configuration>
        EOF
        if [ ! -d /tmp/hadoop-root/dfs/name/current ]; then
          hdfs namenode -format -force -nonInteractive
        fi
        hdfs datanode &
        exec hdfs namenode
    ports:
      - "8020:8020"   # HDFS RPC
    volumes:
      - ${VOLUME_BASE}/hadoop/namenode:/tmp/hadoop-root/dfs/name
      - ${VOLUME_BASE}/hadoop/datanode:/tmp/hadoop-root/dfs/data
    networks:
      devtools-network:
        ipv4_address: 172.18.0.31
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9870/jmx?qry=Hadoop:service=NameNode,name=NameNodeStatus || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  # Hive Metastore + HiveServer2（依赖 postgres + hadoop）
  hive:
    restart: always
    image: apache/hive:4.0.1
    container_name: hive
    environment:
      SERVICE_NAME: hiveserver2
    ports:
      - "10010:10000"  # HiveServer2 JDBC（避开 azurite 的 10000）
    depends_on:
      hadoop:
        condition: service_healthy
    networks:
      devtools-network:
        ipv4_address: 172.18.0.32
    healthcheck:
      test: ["CMD-SHELL", "beeline -u 'jdbc:hive2://localhost:10000' -e 'show databases;' || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 120s

  # Apache Spark（Master）
  spark:
    restart: always
    image: apache/spark:latest
    container_name: spark
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      SPARK_MASTER_HOST: spark
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8080
    ports:
      - "7077:7077"   # Spark Master RPC
    networks:
      devtools-network:
        ipv4_address: 172.18.0.33
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Spark Worker
  spark-worker:
    restart: always
    image: apache/spark:latest
    container_name: spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark:7077
    environment:
      SPARK_WORKER_MEMORY: 1G
      SPARK_WORKER_CORES: 1
    depends_on:
      - spark
    networks:
      devtools-network:
        ipv4_address: 172.18.0.34

  # Apache Flink（JobManager）
  flink:
    restart: always
    image: flink:latest
    container_name: flink
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink
        taskmanager.numberOfTaskSlots: 2
    networks:
      devtools-network:
        ipv4_address: 172.18.0.35
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/overview"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Flink TaskManager
  flink-taskmanager:
    restart: always
    image: flink:latest
    container_name: flink-taskmanager
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink
        taskmanager.numberOfTaskSlots: 2
        taskmanager.memory.process.size: 1024m
    depends_on:
      - flink
    networks:
      devtools-network:
        ipv4_address: 172.18.0.36

  # ClickHouse（列式 OLAP 数据库）
  clickhouse:
    restart: always
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    ports:
      - "9009:9000"   # Native TCP（应用直连）
    environment:
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: cZgWD@tPYvTx^EZAWQ-_g5aY
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ${VOLUME_BASE}/clickhouse/data:/var/lib/clickhouse
      - ${VOLUME_BASE}/clickhouse/logs:/var/log/clickhouse-server
    networks:
      devtools-network:
        ipv4_address: 172.18.0.37
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  devtools-network:
    name: devtools-network
    external: false
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/16

volumes:
  camunda-zeebe-data:
  camunda-elasticsearch-data:
