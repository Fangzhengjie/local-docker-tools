# hadoop service routes

    location /hadoop/ {
        proxy_pass http://hadoop:9870/;
        proxy_redirect ~^https?://[^/]+(/.*)$ $scheme://$host/hadoop$1;
        proxy_redirect / /hadoop/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /hadoop;
        proxy_set_header X-Script-Name /hadoop;
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter 'href="/' 'href="/hadoop/';
        sub_filter 'src="/' 'src="/hadoop/';
        sub_filter 'action="/' 'action="/hadoop/';
    }
