server {
    listen 80;
    server_name openobserve.local.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name openobserve.local.dev;

    ssl_certificate /etc/nginx/certs/docker-services.crt;
    ssl_certificate_key /etc/nginx/certs/docker-services.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 上传日志体积可能较大
    client_max_body_size 32m;

    location / {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $upstream_openobserve http://openobserve:5080;
        proxy_pass $upstream_openobserve;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持（OpenObserve UI 实时日志流）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
