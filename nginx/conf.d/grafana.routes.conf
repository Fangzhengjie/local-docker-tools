# grafana service routes

    # Normalize links generated with the sub-path duplicated.
    location /grafana/grafana/ {
        rewrite ^/grafana/grafana(/.*)$ /grafana$1 permanent;
    }

    location /grafana/ {
        set $upstream_grafana http://grafana:3000;
        proxy_pass $upstream_grafana;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
