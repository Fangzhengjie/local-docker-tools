# rocketmq service routes

    # The dashboard bundle uses root-relative API URLs while mounted at /rocketmq/.
    location /rocketmq-dashboard/ {
        proxy_pass http://rocketmq-dashboard:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(acl|cluster|consumer|dashboard|dlqMessage|login|message|messageTrace|monitor|ops|producer|proxy|topic)(/|$) {
        proxy_pass http://rocketmq-dashboard:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /rocketmq/ {
        proxy_pass http://rocketmq-dashboard:8082/;
        proxy_redirect / /rocketmq/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://rocketmq-dashboard:8082/static/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
