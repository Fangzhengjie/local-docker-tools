# redisinsight service routes

    # RedisInsight requests this endpoint from the host root when mounted below
    # /redisinsight/. Keep the route explicit because /api is shared by other UIs.
    location = /api/features {
        proxy_pass http://redisinsight:5540/api/features;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    location /redisinsight/ {
        proxy_pass http://redisinsight:5540/;
        proxy_set_header X-Forwarded-Prefix /redisinsight;
        proxy_set_header X-Script-Name /redisinsight;
        include /etc/nginx/conf.d/proxy_params.inc;
    }
