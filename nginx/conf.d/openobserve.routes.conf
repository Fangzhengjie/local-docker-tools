# openobserve service routes

    location = /openobserve/ {
        return 302 /openobserve/web/;
    }

    location /openobserve/ {
        proxy_pass http://openobserve:5080/;
        proxy_redirect /web/ /openobserve/web/;
        proxy_set_header X-Forwarded-Prefix /openobserve;
        proxy_set_header X-Script-Name /openobserve;
        include /etc/nginx/conf.d/proxy_params.inc;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    location = /web/login {
        return 302 /openobserve/web/login;
    }

    location /web/ {
        return 302 /openobserve$uri$is_args$args;
    }

    location /auth/ {
        proxy_pass http://openobserve:5080;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    location = /api {
        proxy_pass http://openobserve:5080;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    location /api/ {
        proxy_pass http://openobserve:5080;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    location = /config {
        proxy_pass http://openobserve:5080;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    location /config/ {
        proxy_pass http://openobserve:5080;
        include /etc/nginx/conf.d/proxy_params.inc;
    }
