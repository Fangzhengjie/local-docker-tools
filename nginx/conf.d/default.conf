# ═══════════════════════════════════════════════════════════════
# 默认 server — 基于路径的反向代理
# 通过 http(s)://hostname/<service> 访问各 Web 服务
# ═══════════════════════════════════════════════════════════════

# HTTP → HTTPS 重定向
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/certs/docker-services.crt;
    ssl_certificate_key /etc/nginx/certs/docker-services.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    resolver 127.0.0.11 valid=30s ipv6=off;

    # ── 首页：服务导航（静态 HTML）──────────────────
    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # ── 静态资源（favicon 等）──────────────────────
    location = /favicon.ico {
        root /usr/share/nginx/html;
        try_files /favicon.ico =204;
        access_log off;
        log_not_found off;
    }

    # ── SonarQube (9000) ────────────────────────────
    # SonarQube 原生支持 context path，需配合 SONAR_WEB_CONTEXT=/sonarqube
    location /sonarqube {
        set $upstream_sonarqube http://sonarqube:9000;
        proxy_pass $upstream_sonarqube;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Grafana (3000) ──────────────────────────────
    # Grafana 原生支持 root_url + serve_from_sub_path
    location /grafana/ {
        set $upstream_grafana http://grafana:3000;
        proxy_pass $upstream_grafana;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Prometheus (9090) ───────────────────────────
    # Prometheus 原生支持 --web.external-url
    location /prometheus/ {
        set $upstream_prometheus http://prometheus:9090;
        proxy_pass $upstream_prometheus;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Kafka UI (8080) ─────────────────────────────
    location /kafka-ui/ {
        set $upstream_kafka_ui http://kafka-ui:8080;
        proxy_pass $upstream_kafka_ui;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── RabbitMQ Management (15672) ─────────────────
    location /rabbitmq/ {
        rewrite ^/rabbitmq(/.*)$ $1 break;
        set $upstream_rabbitmq http://rabbitmq:15672;
        proxy_pass $upstream_rabbitmq;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── RocketMQ Dashboard (8082) ───────────────────
    location /rocketmq/ {
        rewrite ^/rocketmq(/.*)$ $1 break;
        set $upstream_rocketmq http://rocketmq-dashboard:8082;
        proxy_pass $upstream_rocketmq;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── OpenSearch Dashboards (5601) ────────────────
    # 原生支持 server.basePath
    location /opensearch/ {
        set $upstream_osd http://opensearch-dashboards:5601;
        proxy_pass $upstream_osd;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Jaeger (16686) ──────────────────────────────
    # Jaeger 原生支持 QUERY_BASE_PATH
    location /jaeger/ {
        set $upstream_jaeger http://jaeger:16686;
        proxy_pass $upstream_jaeger;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── OpenObserve (5080) ──────────────────────────
    location /openobserve/ {
        rewrite ^/openobserve(/.*)$ $1 break;
        set $upstream_openobserve http://openobserve:5080;
        proxy_pass $upstream_openobserve;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    # ── Mailpit (8025) ──────────────────────────────
    # 原生支持 --webroot
    location /mailpit/ {
        set $upstream_mailpit http://mailpit:8025;
        proxy_pass $upstream_mailpit;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── MinIO Console (9001) ────────────────────────
    location /minio/ {
        rewrite ^/minio(/.*)$ $1 break;
        set $upstream_minio http://minio:9001;
        proxy_pass $upstream_minio;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 0;
    }

    # ── Camunda 8 (8080) ────────────────────────────
    # Camunda 8 runs under /camunda so redirects and asset URLs retain the app prefix.
    location = /camunda {
        return 302 /camunda/operate/;
    }
    location = /camunda/ {
        return 302 /camunda/operate/;
    }
    location /camunda/ {
        set $upstream_camunda http://camunda:8080;
        proxy_pass $upstream_camunda;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /operate {
        return 302 /camunda/operate/;
    }
    location = /tasklist {
        return 302 /camunda/tasklist/;
    }
    location = /admin {
        return 302 /camunda/admin/setup;
    }
    location = /v2 {
        return 302 /camunda/v2/;
    }
    location /operate/ {
        return 302 /camunda$uri;
    }
    location /tasklist/ {
        return 302 /camunda$uri;
    }
    location /admin/ {
        return 302 /camunda$uri;
    }
    location /v2/ {
        return 302 /camunda$uri;
    }
    # ── Spark Master (8080) ─────────────────────────
    location /spark/ {
        proxy_pass http://spark:8080/;
        proxy_redirect ~^http://localhost(/.*)$ /spark$1;
        proxy_redirect http://localhost/ /spark/;
        proxy_redirect / /spark/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Flink (8081) ────────────────────────────────
    # Flink 原生支持 web.base-path (1.20+) / rest.base-path
    location /flink/ {
        proxy_pass http://flink:8081/;
        proxy_redirect ~^http://localhost(/.*)$ /flink$1;
        proxy_redirect http://localhost/ /flink/;
        proxy_redirect / /flink/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Hadoop NameNode (9870) ──────────────────────
    location /hadoop/ {
        proxy_pass http://hadoop:9870/;
        proxy_redirect ~^http://localhost(/.*)$ /hadoop$1;
        proxy_redirect http://localhost/ /hadoop/;
        proxy_redirect / /hadoop/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Wiremock (8080) ─────────────────────────────
    location /wiremock/ {
        rewrite ^/wiremock(/.*)$ $1 break;
        set $upstream_wiremock http://wiremock:8080;
        proxy_pass $upstream_wiremock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── ClickHouse HTTP Play UI (8123) ────────────
    location /clickhouse/ {
        rewrite ^/clickhouse(/.*)$ $1 break;
        set $upstream_clickhouse http://clickhouse:8123;
        proxy_pass $upstream_clickhouse;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Hive Web UI (10002) ───────────────────────
    location /hive/ {
        proxy_pass http://hive:10002/;
        proxy_redirect ~^http://localhost(/.*)$ /hive$1;
        proxy_redirect http://localhost/ /hive/;
        proxy_redirect / /hive/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ══════════════════════════════════════════════
    # AI Services
    # ══════════════════════════════════════════════

    # ── Attu / Milvus UI (3000) ───────────────────
    location /attu/ {
        rewrite ^/attu(/.*)$ $1 break;
        set $upstream_attu http://attu:3000;
        proxy_pass $upstream_attu;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── Open WebUI (8080) ─────────────────────────
    location /open-webui/ {
        rewrite ^/open-webui(/.*)$ $1 break;
        set $upstream_openwebui http://open-webui:8080;
        proxy_pass $upstream_openwebui;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        client_max_body_size 0;
    }

    # ── LiteLLM (4000) ───────────────────────────
    location /litellm/ {
        rewrite ^/litellm(/.*)$ $1 break;
        set $upstream_litellm http://litellm:4000;
        proxy_pass $upstream_litellm;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Flowise (3000) ───────────────────────────
    location /flowise/ {
        rewrite ^/flowise(/.*)$ $1 break;
        set $upstream_flowise http://flowise:3000;
        proxy_pass $upstream_flowise;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── Qdrant Dashboard (6333) ──────────────────
    location /qdrant/ {
        rewrite ^/qdrant(/.*)$ $1 break;
        set $upstream_qdrant http://qdrant:6333;
        proxy_pass $upstream_qdrant;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── SearXNG (8080) ──────────────────────────
    location /searxng/ {
        rewrite ^/searxng(/.*)$ $1 break;
        set $upstream_searxng http://searxng:8080;
        proxy_pass $upstream_searxng;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
