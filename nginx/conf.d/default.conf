# ═══════════════════════════════════════════════════════════════
# 默认 server — 基于路径的反向代理
# 通过 http(s)://hostname/<service> 访问各 Web 服务
# ═══════════════════════════════════════════════════════════════

# HTTP → HTTPS 重定向
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/certs/docker-services.crt;
    ssl_certificate_key /etc/nginx/certs/docker-services.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    resolver 127.0.0.11 valid=30s ipv6=off;

    # ── 首页：服务导航（静态 HTML）──────────────────
    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # ── 静态资源（favicon 等）──────────────────────
    location = /favicon.ico {
        root /usr/share/nginx/html;
        try_files /favicon.ico =204;
        access_log off;
        log_not_found off;
    }

    # ── SonarQube (9000) ────────────────────────────
    # SonarQube 原生支持 context path，需配合 SONAR_WEB_CONTEXT=/sonarqube
    location /sonarqube {
        set $upstream_sonarqube http://sonarqube:9000;
        proxy_pass $upstream_sonarqube;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Grafana (3000) ──────────────────────────────
    # Grafana 原生支持 root_url + serve_from_sub_path
    location /grafana/ {
        set $upstream_grafana http://grafana:3000;
        proxy_pass $upstream_grafana;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Prometheus (9090) ───────────────────────────
    # Prometheus 原生支持 --web.external-url
    location /prometheus/ {
        set $upstream_prometheus http://prometheus:9090;
        proxy_pass $upstream_prometheus;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Kafka UI (8080) ─────────────────────────────
    location /kafka-ui/ {
        set $upstream_kafka_ui http://kafka-ui:8080;
        proxy_pass $upstream_kafka_ui;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── RabbitMQ Management (15672) ─────────────────
    location /rabbitmq/ {
        proxy_pass http://rabbitmq:15672/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── RocketMQ Dashboard (8082) ───────────────────
    location /rocketmq/ {
        proxy_pass http://rocketmq-dashboard:8082/;
        proxy_redirect / /rocketmq/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /static/ {
        proxy_pass http://rocketmq-dashboard:8082/static/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Apache Pulsar Admin API (8080) ───────────────
    location = /pulsar {
        return 301 /pulsar/;
    }
    location = /pulsar/ {
        return 302 /pulsar/admin/v2/clusters;
    }
    location /pulsar/ {
        set $upstream_pulsar http://pulsar:8080;
        rewrite ^/pulsar(/.*)$ $1 break;
        proxy_pass $upstream_pulsar;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── OpenSearch Dashboards (5601) ────────────────
    # 原生支持 server.basePath
    location /opensearch/ {
        set $upstream_osd http://opensearch-dashboards:5601;
        proxy_pass $upstream_osd;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Jaeger (16686) ──────────────────────────────
    # Jaeger 原生支持 QUERY_BASE_PATH
    location /jaeger/ {
        set $upstream_jaeger http://jaeger:16686;
        proxy_pass $upstream_jaeger;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── OpenObserve (5080) ──────────────────────────
    location /openobserve/ {
        proxy_pass http://openobserve:5080/;
        proxy_redirect /web/ /openobserve/web/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    # ── Mailpit (8025) ──────────────────────────────
    # 原生支持 --webroot
    location /mailpit/ {
        set $upstream_mailpit http://mailpit:8025;
        proxy_pass $upstream_mailpit;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── MinIO Console (9001) ────────────────────────
    location /minio/ {
        proxy_pass http://minio:9001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 0;
    }

    # ── Camunda 8 (8080) ────────────────────────────
    # Camunda 8 runs under /camunda so redirects and asset URLs retain the app prefix.
    location = /camunda {
        return 302 /camunda/operate/;
    }
    location = /camunda/ {
        return 302 /camunda/operate/;
    }
    location /camunda/ {
        set $upstream_camunda http://camunda:8080;
        proxy_pass $upstream_camunda;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /operate {
        return 302 /camunda/operate/;
    }
    location = /tasklist {
        return 302 /camunda/tasklist/;
    }
    location = /admin {
        return 302 /camunda/admin/setup;
    }
    location = /v2 {
        return 302 /camunda/v2/;
    }
    location /operate/ {
        return 302 /camunda$uri;
    }
    location /tasklist/ {
        return 302 /camunda$uri;
    }
    location /admin/ {
        return 302 /camunda$uri;
    }
    location /v2/ {
        return 302 /camunda$uri;
    }
    # ── Spark Master (8080) ─────────────────────────
    location /spark/ {
        proxy_pass http://spark:8080/;
        proxy_redirect ~^https?://[^/]+(/.*)$ $scheme://$host/spark$1;
        proxy_redirect / /spark/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Flink (8081) ────────────────────────────────
    # Flink 原生支持 web.base-path (1.20+) / rest.base-path
    location /flink/ {
        proxy_pass http://flink:8081/;
        proxy_redirect ~^https?://[^/]+(/.*)$ $scheme://$host/flink$1;
        proxy_redirect / /flink/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Hadoop NameNode (9870) ──────────────────────
    location /hadoop/ {
        proxy_pass http://hadoop:9870/;
        proxy_redirect ~^https?://[^/]+(/.*)$ $scheme://$host/hadoop$1;
        proxy_redirect / /hadoop/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Wiremock (8080) ─────────────────────────────
    location /wiremock/ {
        proxy_pass http://wiremock:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── ClickHouse HTTP Play UI (8123) ────────────
    location /clickhouse/ {
        proxy_pass http://clickhouse:8123/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Hive Web UI (10002) ───────────────────────
    location /hive/ {
        proxy_pass http://hive:10002/;
        proxy_redirect ~^https?://[^/]+(/.*)$ $scheme://$host/hive$1;
        proxy_redirect / /hive/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ══════════════════════════════════════════════
    # AI Services
    # ══════════════════════════════════════════════

    # ── Attu / Milvus UI (3000) ───────────────────
    location /attu/ {
        proxy_pass http://attu:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── Open WebUI (8080) ─────────────────────────
    location /open-webui/ {
        proxy_pass http://open-webui:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        client_max_body_size 0;
    }

    # ── LiteLLM (4000) ───────────────────────────
    location /litellm/ {
        proxy_pass http://litellm:4000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Flowise (3000) ───────────────────────────
    location /flowise/ {
        proxy_pass http://flowise:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── Qdrant Dashboard (6333) ──────────────────
    location /qdrant/ {
        proxy_pass http://qdrant:6333/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── SearXNG (8080) ──────────────────────────
    location /searxng/ {
        proxy_pass http://searxng:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Tools Web UIs ────────────────────────────────
    location = /keycloak {
        return 301 /keycloak/;
    }
    location ~ ^/(trino|superset|airflow|jupyter|mlflow|pgadmin|redisinsight|alertmanager|cadvisor|node-exporter|keycloak|vault|jenkins|nexus|gitea|uptime-kuma|debezium|sftpgo|ollama|pipelines|mcpo|weaviate|chromadb)$ {
        return 301 /$1/;
    }
    location /trino/ { proxy_pass http://trino:8080/; include /etc/nginx/conf.d/proxy_params.inc; }
    location /superset/ { proxy_pass http://superset:8088/; include /etc/nginx/conf.d/proxy_params.inc; }
    location /airflow/ { proxy_pass http://airflow:8080/; include /etc/nginx/conf.d/proxy_params.inc; }
    location /jupyter/ { proxy_pass http://jupyter:8888/; include /etc/nginx/conf.d/proxy_params.inc; }
    location /mlflow/ { proxy_pass http://mlflow:5000/; include /etc/nginx/conf.d/proxy_params.inc; }
    location /pgadmin/ { proxy_pass http://pgadmin:80/; include /etc/nginx/conf.d/proxy_params.inc; }
    location /redisinsight/ { proxy_pass http://redisinsight:5540/; include /etc/nginx/conf.d/proxy_params.inc; }
    location /alertmanager/ { proxy_pass http://alertmanager:9093/; include /etc/nginx/conf.d/proxy_params.inc; }
    location /cadvisor/ { proxy_pass http://cadvisor:8080/; include /etc/nginx/conf.d/proxy_params.inc; }
    location /node-exporter/ { proxy_pass http://node-exporter:9100/; include /etc/nginx/conf.d/proxy_params.inc; }
    location /keycloak/ {
        set $upstream_keycloak http://keycloak:8080;
        rewrite ^/keycloak(/.*)$ $1 break;
        proxy_pass $upstream_keycloak;
        proxy_redirect ~^https?://[^/]+(/.*)$ $scheme://$host/keycloak$1;
        include /etc/nginx/conf.d/proxy_params.inc;
    }
    location /vault/ {
        proxy_pass http://vault:8200/;
        proxy_redirect / /vault/;
        include /etc/nginx/conf.d/proxy_params.inc;
    }
    location /jenkins/ { proxy_pass http://jenkins:8080/; include /etc/nginx/conf.d/proxy_params.inc; }
    location /nexus/ { proxy_pass http://nexus:8081/; include /etc/nginx/conf.d/proxy_params.inc; }
    location /gitea/ { proxy_pass http://gitea:3000/; include /etc/nginx/conf.d/proxy_params.inc; }
    location /uptime-kuma/ { proxy_pass http://uptime-kuma:3001/; include /etc/nginx/conf.d/proxy_params.inc; }
    location /debezium/ { proxy_pass http://debezium-connect:8083/; include /etc/nginx/conf.d/proxy_params.inc; }
    location /sftpgo/ { proxy_pass http://sftpgo:8080/; include /etc/nginx/conf.d/proxy_params.inc; }

    # ── AI APIs and Web UIs ──────────────────────────
    location /ollama/ { proxy_pass http://ollama:11434/; include /etc/nginx/conf.d/proxy_params.inc; }
    location /pipelines/ { proxy_pass http://pipelines:9099/; include /etc/nginx/conf.d/proxy_params.inc; }
    location /mcpo/ { proxy_pass http://mcpo:8000/; include /etc/nginx/conf.d/proxy_params.inc; }
    location /weaviate/ { proxy_pass http://weaviate:8080/; include /etc/nginx/conf.d/proxy_params.inc; }
    location /chromadb/ { proxy_pass http://chromadb:8000/; include /etc/nginx/conf.d/proxy_params.inc; }

}
