# ═══════════════════════════════════════════════════════════════
# 默认 server — 基于路径的反向代理
# 通过 http(s)://hostname/<service> 访问各 Web 服务
# ═══════════════════════════════════════════════════════════════

# HTTP → HTTPS 重定向
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/certs/docker-services.crt;
    ssl_certificate_key /etc/nginx/certs/docker-services.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    resolver 127.0.0.11 valid=30s ipv6=off;

    # ── 首页：服务导航（静态 HTML）──────────────────

    # Independently maintained service routes
    include /etc/nginx/conf.d/*.routes.conf;

}
