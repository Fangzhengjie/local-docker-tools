name: tools

services:
  trino:
    image: trinodb/trino:latest
    container_name: trino
    user: "0:0"
    volumes:
      - ./trino:/etc/trino:ro
      - ${VOLUME_BASE}/trino/data:/data/trino
    networks:
      - infra-network
    healthcheck:
      disable: true

  superset:
    image: apache/superset:latest
    container_name: superset
    user: "0:0"
    command: >
      sh -c "superset db upgrade &&
      superset init &&
      superset run -h 0.0.0.0 -p 8088"
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-local-dev-superset-secret}
    volumes:
      - ${VOLUME_BASE}/superset:/app/superset_home
    networks:
      - infra-network
    depends_on:
      - trino

  airflow:
    image: apache/airflow:latest
    container_name: airflow
    user: "0:0"
    command: standalone
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
      AIRFLOW__WEBSERVER__BASE_URL: https://w9060sh012w11.s09060.cn.wal-mart.com/airflow/
    volumes:
      - ${VOLUME_BASE}/airflow:/opt/airflow
    networks:
      - infra-network

  dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:1.9.0
    container_name: dbt
    entrypoint: ["/bin/sh", "-c"]
    command: tail -f /dev/null
    volumes:
      - ${VOLUME_BASE}/dbt:/workspace
    networks:
      - infra-network

  jupyter:
    image: quay.io/jupyter/scipy-notebook:latest
    container_name: jupyter
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-local-dev-jupyter}
    command: start-notebook.py --ServerApp.base_url=/jupyter/
    volumes:
      - ${VOLUME_BASE}/jupyter:/home/jovyan/work
    networks:
      - infra-network

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.22.0
    container_name: mlflow
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlflow/mlflow.db
    volumes:
      - ${VOLUME_BASE}/mlflow:/mlflow
    networks:
      - infra-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    user: "0:0"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-local-dev-pgadmin}
    volumes:
      - ${VOLUME_BASE}/pgadmin:/var/lib/pgadmin
    networks:
      - infra-network

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    user: "0:0"
    volumes:
      - ${VOLUME_BASE}/redisinsight:/data
    networks:
      - infra-network

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --web.external-url=/alertmanager/
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
    networks:
      - infra-network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    networks:
      - infra-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks:
      - infra-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "14317:4317"
      - "14318:4318"
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    networks:
      - infra-network

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    user: "0:0"
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-local-dev-keycloak}
    volumes:
      - ${VOLUME_BASE}/keycloak:/opt/keycloak/data
    networks:
      - infra-network

  vault:
    image: hashicorp/vault:latest
    container_name: vault
    command: server -dev -dev-root-token-id=local-dev-root-token -dev-listen-address=0.0.0.0:8200
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    cap_add:
      - IPC_LOCK
    volumes:
      - ${VOLUME_BASE}/vault/data:/vault/file
    networks:
      - infra-network

  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    user: "0:0"
    ports:
      - "50000:50000"
    environment:
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
      JENKINS_OPTS: --prefix=/jenkins
    volumes:
      - ${VOLUME_BASE}/jenkins:/var/jenkins_home
    networks:
      - infra-network

  nexus:
    image: sonatype/nexus3:latest
    container_name: nexus
    user: "0:0"
    environment:
      INSTALL4J_ADD_VM_PARAMS: -Dnexus-context-path=/nexus
    volumes:
      - ${VOLUME_BASE}/nexus:/nexus-data
    networks:
      - infra-network

  gitea:
    image: gitea/gitea:latest
    container_name: gitea
    ports:
      - "2222:22"
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
    volumes:
      - ${VOLUME_BASE}/gitea:/data
    networks:
      - infra-network

  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    user: "0:0"
    volumes:
      - ${VOLUME_BASE}/uptime-kuma:/app/data
    networks:
      - infra-network

  debezium-connect:
    image: quay.io/debezium/connect:latest
    container_name: debezium-connect
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: "debezium"
      CONFIG_STORAGE_TOPIC: debezium_connect_configs
      OFFSET_STORAGE_TOPIC: debezium_connect_offsets
      STATUS_STORAGE_TOPIC: debezium_connect_status
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
    volumes:
      - ${VOLUME_BASE}/debezium:/kafka/data
    networks:
      - infra-network
      - messaging-network

  sftpgo:
    image: drakkan/sftpgo:latest
    container_name: sftpgo
    ports:
      - "2022:2022"
    volumes:
      - type: bind
        source: ${VOLUME_BASE}/sftpgo
        target: /srv/sftpgo
    networks:
      - infra-network

  clamav:
    image: clamav/clamav:latest
    container_name: clamav
    ports:
      - "3310:3310"
    environment:
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      http_proxy: ${HTTP_PROXY:-}
      https_proxy: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
    volumes:
      - ${VOLUME_BASE}/clamav:/var/lib/clamav
    networks:
      - infra-network

networks:
  infra-network:
    external: true
  messaging-network:
    external: true
