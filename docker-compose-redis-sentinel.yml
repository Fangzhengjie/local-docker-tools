# Redis Sentinel（1主2从 + 3哨兵）— 主从自动故障转移
#
# 端口不与 devtools 单机 Redis (6379) 冲突，可同时运行
#
# Usage:
#   make cluster-redis-sentinel-up
#   make cluster-redis-sentinel-down
#
# 连接 Sentinel: redis-cli -p 6380 -a 'cZgWD@tPYvTx^EZAWQ-_g5aY'
name: redis-sentinel

services:

  # 作用：Redis：缓存、会话、分布式锁和高性能键值存储
  redis-sentinel-master:
    restart: always
    image: redis:7-alpine
    container_name: redis-sentinel-master
    command: >
      redis-server
      --port 6380
      --appendonly yes
      --requirepass cZgWD@tPYvTx^EZAWQ-_g5aY
      --masterauth cZgWD@tPYvTx^EZAWQ-_g5aY
    ports:
      - "6380:6380"
    volumes:
      - ${VOLUME_BASE}/redis-sentinel/master:/data
    networks:
      cluster-network:
        ipv4_address: 172.21.0.20
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "-a", "cZgWD@tPYvTx^EZAWQ-_g5aY", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 作用：Redis：缓存、会话、分布式锁和高性能键值存储
  redis-sentinel-slave-1:
    restart: always
    image: redis:7-alpine
    container_name: redis-sentinel-slave-1
    command: >
      redis-server
      --port 6381
      --appendonly yes
      --requirepass cZgWD@tPYvTx^EZAWQ-_g5aY
      --masterauth cZgWD@tPYvTx^EZAWQ-_g5aY
      --replicaof redis-sentinel-master 6380
    ports:
      - "6381:6381"
    volumes:
      - ${VOLUME_BASE}/redis-sentinel/slave-1:/data
    depends_on:
      redis-sentinel-master:
        condition: service_healthy
    networks:
      cluster-network:
        ipv4_address: 172.21.0.21
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6381", "-a", "cZgWD@tPYvTx^EZAWQ-_g5aY", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 作用：Redis：缓存、会话、分布式锁和高性能键值存储
  redis-sentinel-slave-2:
    restart: always
    image: redis:7-alpine
    container_name: redis-sentinel-slave-2
    command: >
      redis-server
      --port 6382
      --appendonly yes
      --requirepass cZgWD@tPYvTx^EZAWQ-_g5aY
      --masterauth cZgWD@tPYvTx^EZAWQ-_g5aY
      --replicaof redis-sentinel-master 6380
    ports:
      - "6382:6382"
    volumes:
      - ${VOLUME_BASE}/redis-sentinel/slave-2:/data
    depends_on:
      redis-sentinel-master:
        condition: service_healthy
    networks:
      cluster-network:
        ipv4_address: 172.21.0.22
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6382", "-a", "cZgWD@tPYvTx^EZAWQ-_g5aY", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 作用：Redis：缓存、会话、分布式锁和高性能键值存储
  redis-sentinel-1:
    restart: always
    image: redis:7-alpine
    container_name: redis-sentinel-1
    command:
      - sh
      - -c
      - |
        cat > /tmp/sentinel.conf << 'EOF'
        port 26379
        sentinel monitor mymaster 172.21.0.20 6380 2
        sentinel auth-pass mymaster cZgWD@tPYvTx^EZAWQ-_g5aY
        sentinel down-after-milliseconds mymaster 5000
        sentinel failover-timeout mymaster 10000
        sentinel parallel-syncs mymaster 1
        EOF
        redis-sentinel /tmp/sentinel.conf
    ports:
      - "26379:26379"
    depends_on:
      redis-sentinel-master:
        condition: service_healthy
      redis-sentinel-slave-1:
        condition: service_healthy
      redis-sentinel-slave-2:
        condition: service_healthy
    networks:
      cluster-network:
        ipv4_address: 172.21.0.23
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 作用：Redis：缓存、会话、分布式锁和高性能键值存储
  redis-sentinel-2:
    restart: always
    image: redis:7-alpine
    container_name: redis-sentinel-2
    command:
      - sh
      - -c
      - |
        cat > /tmp/sentinel.conf << 'EOF'
        port 26380
        sentinel monitor mymaster 172.21.0.20 6380 2
        sentinel auth-pass mymaster cZgWD@tPYvTx^EZAWQ-_g5aY
        sentinel down-after-milliseconds mymaster 5000
        sentinel failover-timeout mymaster 10000
        sentinel parallel-syncs mymaster 1
        EOF
        redis-sentinel /tmp/sentinel.conf
    ports:
      - "26380:26380"
    depends_on:
      redis-sentinel-master:
        condition: service_healthy
    networks:
      cluster-network:
        ipv4_address: 172.21.0.24
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26380", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 作用：Redis：缓存、会话、分布式锁和高性能键值存储
  redis-sentinel-3:
    restart: always
    image: redis:7-alpine
    container_name: redis-sentinel-3
    command:
      - sh
      - -c
      - |
        cat > /tmp/sentinel.conf << 'EOF'
        port 26381
        sentinel monitor mymaster 172.21.0.20 6380 2
        sentinel auth-pass mymaster cZgWD@tPYvTx^EZAWQ-_g5aY
        sentinel down-after-milliseconds mymaster 5000
        sentinel failover-timeout mymaster 10000
        sentinel parallel-syncs mymaster 1
        EOF
        redis-sentinel /tmp/sentinel.conf
    ports:
      - "26381:26381"
    depends_on:
      redis-sentinel-master:
        condition: service_healthy
    networks:
      cluster-network:
        ipv4_address: 172.21.0.25
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26381", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  cluster-network:
    name: cluster-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
