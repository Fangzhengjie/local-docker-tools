name: optional

services:
  # 作用：locust 容器，提供该服务或集群节点能力
  locust:
    profiles: ["loadtest"]
    image: locustio/locust:latest
    container_name: locust
    command: -f /mnt/locust/locustfile.py --host=http://nginx:80
    volumes:
      - ${VOLUME_BASE}/locust:/mnt/locust
    ports:
      - "8089:8089"
    networks:
      infra-network:

  # 作用：k6 容器，提供该服务或集群节点能力
  k6:
    profiles: ["loadtest"]
    image: grafana/k6:latest
    container_name: k6
    entrypoint: ["sleep", "infinity"]
    volumes:
      - ${VOLUME_BASE}/k6:/scripts
    networks:
      infra-network:

  # 作用：marquez 容器，提供该服务或集群节点能力
  marquez:
    profiles: ["lineage"]
    image: marquezproject/marquez:0.50.0
    container_name: marquez
    environment:
      MARQUEZ_PORT: 5000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: marquez
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: cZgWD@tPYvTx^EZAWQ-_g5aY
    networks:
      database-network:
      infra-network:

  # 作用：marquez-web 容器，提供该服务或集群节点能力
  marquez-web:
    profiles: ["lineage"]
    image: marquezproject/marquez-web:0.50.0
    container_name: marquez-web
    environment:
      MARQUEZ_HOST: marquez
      MARQUEZ_PORT: 5000
    networks:
      infra-network:
    depends_on:
      - marquez

networks:
  infra-network:
    name: infra-network
    external: true
  database-network:
    name: database-network
    external: true
